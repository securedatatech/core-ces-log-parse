name: Full validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: false
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: >-
          uv run --locked --python ${{ matrix.python-version }} pytest
          --cov=core_ces_log_parse
          --cov-report=term-missing
          --cov-fail-under=80

  quality:
    name: Full quality checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: false
      - name: Install Python
        run: uv python install 3.14
      - name: Sync locked environment
        run: uv sync --locked --python 3.14
      - name: Check formatting
        run: uv run --locked --python 3.14 ruff format --check .
      - name: Run Ruff
        run: uv run --locked --python 3.14 ruff check .
      - name: Run mypy
        run: uv run --locked --python 3.14 mypy src
      - name: Check CI safeguards
        run: python3 -B .github/scripts/ci_safeguards.py
      - name: Exercise smoke guard with pytest
        run: uv run --locked --python 3.14 pytest .github/tests/test_smoke_integration.py
      - name: Run pre-commit
        run: uv run --locked --python 3.14 pre-commit run --all-files

  security:
    name: Full dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: false
      - name: Install Python
        run: uv python install 3.14
      - name: Sync locked environment
        run: uv sync --locked --python 3.14
      - name: Audit dependencies
        run: uv run --locked --python 3.14 pip-audit

  package:
    name: Full wheel verification
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: false
      - name: Install Python
        run: uv python install 3.14
      - name: Sync locked environment
        run: uv sync --locked --python 3.14
      - name: Build wheel
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Create wheel environment
        run: uv venv --python 3.14 "$RUNNER_TEMP/wheel-venv"
      - name: Install wheel
        run: >-
          uv pip install
          --python "$RUNNER_TEMP/wheel-venv/bin/python"
          --no-deps
          "$RUNNER_TEMP/dist/"*.whl
      - name: Verify installed CLI
        run: >-
          "$RUNNER_TEMP/wheel-venv/bin/python"
          -m core_ces_log_parse.main --help
      - name: Run installed sample smoke test
        run: >-
          "$RUNNER_TEMP/wheel-venv/bin/python"
          -m core_ces_log_parse.main
          --logs tests/fixtures/sample.log
          --senders tests/fixtures/senders.txt
          --out "$RUNNER_TEMP/sample-output.txt"

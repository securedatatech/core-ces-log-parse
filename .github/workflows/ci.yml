name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route the complete PR and validate prose
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B .github/scripts/ci_scope.py
      - name: Require explicit routing outputs
        env:
          SMOKE: ${{ steps.scope.outputs.smoke }}
          INPUTS: ${{ steps.scope.outputs.inputs }}
        run: |
          case "$SMOKE/$INPUTS" in
            true/false|false/false) ;;
            *) echo "Invalid or missing routing result" >&2; exit 1 ;;
          esac
      - name: Check CI safeguards
        run: python3 -B .github/scripts/ci_safeguards.py
      - name: Install uv
        if: steps.scope.outputs.smoke == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
      - name: Install Python
        if: steps.scope.outputs.smoke == 'true'
        run: uv python install 3.14
      - name: Sync locked environment
        if: steps.scope.outputs.smoke == 'true'
        run: uv sync --locked --python 3.14
      - name: Check formatting, lint, and syntax
        if: steps.scope.outputs.smoke == 'true'
        run: |
          uv run --locked --python 3.14 ruff format --check .
          uv run --locked --python 3.14 ruff check .
          uv run --locked --python 3.14 python -m compileall -q src tests .github/scripts .github/tests
      - name: Run fixed smoke checks without coverage
        if: steps.scope.outputs.smoke == 'true'
        run: uv run --locked --python 3.14 python .github/scripts/ci_smoke.py
